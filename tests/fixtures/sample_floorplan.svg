<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500.0 -500.0 6000.0 5000.0" width="100%" height="100%" style="background-color: #f8fafc;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <g id="rooms">
    <polygon points="0.0,0.0 5000.0,0.0 5000.0,4000.0 0.0,4000.0 0.0,0.0" fill="#e8f4f8" stroke="#1e293b" stroke-width="40" stroke-linejoin="round" filter="url(#shadow)"/>
  </g>
  <g id="doors">
    <line x1="1000.0" y1="0.0" x2="1900.0" y2="0.0" stroke="#ef4444" stroke-width="60" stroke-linecap="round"/>
  </g>
  <g id="labels">
    <text x="2500.0" y="1960.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="700" fill="#0f172a">Living Room</text>
    <text x="2500.0" y="2140.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="500" fill="#64748b">20.0 m²</text>
  </g>
</svg>