[tool.poetry]
name = "control-bim-pf-engine"
version = "0.1.0"
description = "Pre-Feasibility Engine - Deterministic CAD to BIM & ControlNet visual restyling"
authors = ["Davide <davide-valentino@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
ezdxf = "^1.4.4"
replicate = "^1.0.7"
pillow = "^12.3.0"
numpy = "<2"
requests = "^2.34.2"
cairosvg = "^2.9.0"
scikit-image = "^0.26.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
httpx = "^0.27.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.4"

[tool.poetry.group.dev.dependencies]
pytest-xdist = "^3.8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_provider: integration tests requiring real provider API credentials"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

