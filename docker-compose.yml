services:
  control-bim-pf-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-bim-pf-engine-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - PF_API_KEY=${PF_API_KEY:-}
      - DRY_RUN=${DRY_RUN:-0}
      - IOU_THRESHOLD=${IOU_THRESHOLD:-0.85}
      - IOU_WARN_THRESHOLD=${IOU_WARN_THRESHOLD:-0.90}
      - WARMUP_PROBE=${WARMUP_PROBE:-0}
    env_file:
      - path: .env.local
        required: false
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
